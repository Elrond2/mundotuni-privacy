<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 340" width="260" height="340">
  <!--
    Tuni — referencia Rive alineada con TuniPainter Canvas (P.Canvas #11).
    Fuente de verdad visual: lib/core/character_system/tuni_painter.dart
    NO usar como arte final plano — el render en app usa gradientes y profundidad.
  -->

  <defs>
    <radialGradient id="bodyGrad" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#8FD6F2"/>
      <stop offset="28%" stop-color="#58B8EA"/>
      <stop offset="58%" stop-color="#2E8BD6"/>
      <stop offset="100%" stop-color="#1F5F9E"/>
    </radialGradient>
    <radialGradient id="bellyGrad" cx="50%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#FFFDF6"/>
      <stop offset="55%" stop-color="#EAF6FC"/>
      <stop offset="100%" stop-color="#C4E4F4"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#4A9CC8"/>
      <stop offset="22%" stop-color="#2E6E96"/>
      <stop offset="58%" stop-color="#12354E"/>
      <stop offset="100%" stop-color="#06121E"/>
    </radialGradient>
    <radialGradient id="blushGrad" cx="40%" cy="35%" r="72%">
      <stop offset="0%" stop-color="#FF7E66" stop-opacity="0.62"/>
      <stop offset="42%" stop-color="#FF7E66" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF7E66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C84C4"/>
      <stop offset="100%" stop-color="#1E5188"/>
    </linearGradient>
  </defs>

  <g id="ground_shadow">
    <ellipse cx="130" cy="320" rx="72" ry="13" fill="#143049" opacity="0.20"/>
  </g>

  <g id="tail">
    <g id="lobe_left">
      <path d="M 118,252 C 108,254 86,254 62,258 C 38,262 18,274 16,292 C 24,300 42,298 62,290 C 82,282 98,272 108,266 C 112,264 116,260 118,252 Z"
            fill="url(#finGrad)" stroke="#143049" stroke-width="2.2" stroke-linejoin="round"/>
    </g>
    <g id="lobe_right">
      <path d="M 142,252 C 152,254 174,254 198,258 C 222,262 242,274 244,292 C 236,300 218,298 198,290 C 178,282 162,272 152,266 C 148,264 144,260 142,252 Z"
            fill="url(#finGrad)" stroke="#143049" stroke-width="2.2" stroke-linejoin="round"/>
    </g>
    <g id="peduncle">
      <path d="M 116,232 C 112,240 110,250 112,264 C 118,261 124,260 130,260 C 136,260 142,261 148,264 C 150,250 148,240 144,232 C 140,234 135,236 130,236 C 125,236 120,234 116,232 Z"
            fill="url(#finGrad)" stroke="#143049" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <g id="notch">
      <path d="M 112,264 C 120,270 125,274 130,274 C 135,274 140,270 148,264"
            fill="none" stroke="#143049" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>

  <g id="body">
    <g id="body_ellipse">
      <path d="M 124,58 C 172,52 212,86 214,134 C 220,188 198,232 150,246 C 128,252 102,250 76,234 C 42,208 24,152 36,106 C 44,72 82,54 124,58 Z"
            fill="url(#bodyGrad)" stroke="#143049" stroke-width="2.8" stroke-linejoin="round"/>
    </g>
    <g id="belly">
      <path d="M 130,72 C 160,76 180,98 182,132 C 184,165 174,196 160,215 C 150,228 140,232 130,232 C 120,232 110,228 100,215 C 86,196 76,165 78,132 C 80,98 100,76 130,72 Z"
            fill="url(#bellyGrad)" stroke="none"/>
    </g>
    <g id="lateral_line">
      <path d="M 42,146 C 76,132 100,128 130,130 C 160,132 184,136 218,148"
            fill="none" stroke="#4C96B2" stroke-width="1.8" opacity="0.45" stroke-linecap="round"/>
    </g>
  </g>

  <g id="dorsal_fin">
    <path d="M 108,64 C 112,44 120,18 134,6 C 138,3 143,4 147,8 C 155,18 160,44 162,64 C 152,61 142,59 130,59 C 118,59 118,61 108,64 Z"
          fill="url(#finGrad)" stroke="#143049" stroke-width="2.2" stroke-linejoin="round"/>
  </g>

  <g id="arm_left">
    <path d="M 74,134 C 66,122 50,118 36,126 C 22,124 16,130 16,136 C 14,142 8,148 8,154 C 8,160 14,166 22,174 C 30,182 44,192 58,190 C 68,188 74,178 76,164 C 78,150 76,142 74,134 Z"
          fill="url(#finGrad)" stroke="#143049" stroke-width="2.2" stroke-linejoin="round"/>
  </g>

  <g id="arm_right">
    <path d="M 186,134 C 194,122 210,118 224,126 C 238,124 244,130 244,136 C 246,142 252,148 252,154 C 252,160 246,166 238,174 C 230,182 216,192 202,190 C 192,188 186,178 184,164 C 182,150 184,142 186,134 Z"
          fill="url(#finGrad)" stroke="#143049" stroke-width="2.2" stroke-linejoin="round"/>
  </g>

  <g id="face">
    <g id="cheeks">
      <ellipse cx="62" cy="158" rx="28" ry="17" fill="url(#blushGrad)"/>
      <ellipse cx="198" cy="158" rx="28" ry="17" fill="url(#blushGrad)"/>
    </g>

    <g id="eye_left">
      <ellipse cx="90" cy="126" rx="26.5" ry="28.5" fill="#FFFEFC" stroke="#143049" stroke-width="2.4"/>
      <ellipse cx="90" cy="129" rx="18" ry="20" fill="url(#irisGrad)"/>
      <ellipse cx="90" cy="129" rx="18.6" ry="20.6" fill="none" stroke="#7EC4E8" stroke-width="1.8" opacity="0.45"/>
      <ellipse cx="91" cy="131" rx="11" ry="13" fill="#050D16"/>
      <ellipse cx="81" cy="121" rx="7.5" ry="8.5" fill="#FFFFFF"/>
      <ellipse cx="96" cy="137" rx="3.8" ry="4.2" fill="#FFFFFF" opacity="0.55"/>
      <path d="M 66,118 C 76,110 104,110 114,118" fill="none" stroke="#143049" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M 72,138 Q 90,146 108,138" fill="none" stroke="#143049" stroke-width="1.6" stroke-linecap="round" opacity="0.28"/>
    </g>

    <g id="eye_right">
      <ellipse cx="170" cy="126" rx="26.5" ry="28.5" fill="#FFFEFC" stroke="#143049" stroke-width="2.4"/>
      <ellipse cx="170" cy="129" rx="18" ry="20" fill="url(#irisGrad)"/>
      <ellipse cx="170" cy="129" rx="18.6" ry="20.6" fill="none" stroke="#7EC4E8" stroke-width="1.8" opacity="0.45"/>
      <ellipse cx="169" cy="131" rx="11" ry="13" fill="#050D16"/>
      <ellipse cx="161" cy="121" rx="7.5" ry="8.5" fill="#FFFFFF"/>
      <ellipse cx="176" cy="137" rx="3.8" ry="4.2" fill="#FFFFFF" opacity="0.55"/>
      <path d="M 146,118 C 156,110 184,110 194,118" fill="none" stroke="#143049" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M 152,138 Q 170,146 188,138" fill="none" stroke="#143049" stroke-width="1.6" stroke-linecap="round" opacity="0.28"/>
    </g>

    <g id="brow_left">
      <path d="M 66,100 C 78,91 102,89 116,96" fill="none" stroke="#143049" stroke-width="6.5" stroke-linecap="round"/>
    </g>
    <g id="brow_right">
      <path d="M 144,96 C 158,89 182,91 194,100" fill="none" stroke="#143049" stroke-width="6.5" stroke-linecap="round"/>
    </g>

    <g id="mouth">
      <path d="M 102,174 C 110,186 120,190 130,190 C 140,190 148,186 156,174"
            fill="none" stroke="#2A4A5C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
